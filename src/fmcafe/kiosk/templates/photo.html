<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Print a Photo</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: system-ui, sans-serif;
      background: #222;
      color: #fff;
      margin: 0;
      padding: 1rem;
    }
    header { display: flex; align-items: center; justify-content: space-between; }
    header a {
      color: #fff;
      text-decoration: none;
      font-size: 1.2rem;
      padding: 0.5rem 0.8rem;
      background: #444;
      border-radius: 8px;
    }
    h1 { font-size: 1.5rem; margin: 0; }

    .picker {
      display: block;
      max-width: 420px;
      margin: 2rem auto;
      padding: 3rem 1rem;
      text-align: center;
      border: 3px dashed #555;
      border-radius: 16px;
      cursor: pointer;
    }
    .picker span { display: block; font-size: 1.1rem; }
    input[type="file"] { display: none; }

    #preview-wrap { max-width: 420px; margin: 1.5rem auto; text-align: center; }
    #preview {
      max-width: 100%;
      max-height: 50vh;
      border-radius: 12px;
      display: none;
    }

    #print-btn {
      display: block;
      max-width: 420px;
      width: 100%;
      margin: 1.5rem auto 0;
      padding: 1.1rem;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #2e8b57;
      color: #fff;
      cursor: pointer;
    }
    #print-btn:disabled { background: #555; opacity: 0.6; }
    #status { text-align: center; margin-top: 0.75rem; min-height: 1.2rem; }
  </style>
</head>
<body>
  <header>
    <a href="{{ url_for('index') }}">&larr; Back</a>
    <h1>Print a Photo</h1>
    <span></span>
  </header>

  <label class="picker" id="picker">
    <span>📷</span>
    <span>Tap to choose a photo</span>
    <input type="file" id="file-input" accept="image/*" capture="environment">
  </label>

  <div id="preview-wrap">
    <img id="preview" alt="">
  </div>

  <button id="print-btn" disabled>Print Photo</button>
  <div id="status"></div>

  <script>
    const fileInput = document.getElementById("file-input");
    const preview = document.getElementById("preview");
    const printBtn = document.getElementById("print-btn");
    const statusEl = document.getElementById("status");

    function setStatus(message) {
      statusEl.textContent = message;
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;

      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      printBtn.disabled = false;
      setStatus("");
    });

    printBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) {
        setStatus("Choose a photo first!");
        return;
      }

      printBtn.disabled = true;
      setStatus("Printing...");

      const formData = new FormData();
      formData.append("photo", file);

      try {
        const response = await fetch("/api/print-photo", { method: "POST", body: formData });
        const data = await response.json().catch(() => ({}));

        if (response.ok) {
          setStatus("Photo sent to the printer! 🧾");
          fileInput.value = "";
          preview.style.display = "none";
        } else if (data.status === "cooling_down") {
          setStatus("Printer's still warming up from the last print — try again shortly.");
        } else if (data.status === "printer_offline") {
          setStatus("Printer isn't connected right now — check the cable and try again.");
        } else if (data.status === "too_large") {
          setStatus("That photo is too big — try a smaller one.");
        } else if (data.status === "invalid_image") {
          setStatus("That doesn't look like a photo — try a different file.");
        } else {
          setStatus("Couldn't print that photo.");
        }
      } catch (err) {
        setStatus("Couldn't reach the printer.");
      } finally {
        printBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
