[project]
name = "fmcafe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jon Collins", email = "joncollins1@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "gpiozero>=2.0.1.post3",
    "python-escpos[usb]>=3.1",
]

[project.scripts]
fmcafe = "fmcafe:main"
fmcafe-preview = "fmcafe.devserver.app:main"
fmcafe-kiosk = "fmcafe.kiosk.run:main"
fmcafe-kiosk-preview = "fmcafe.kiosk.app:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
